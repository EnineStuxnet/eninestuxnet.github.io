<script>
  //November 9th 3pm CEST = 1pm UTC
  const releaseDate = new Date('2026-11-09T13:00:00Z').getTime();
  const foo = setInterval(function(){
    let now = new Date().getTime();
    let differ = releaseDate - now; //ms

    let d = Math.floor( differ/86400000);
    let h = Math.floor((differ%86400000) / 3600000);
    let m = Math.floor((differ%3600000) / 60000);
    let s = Math.floor((differ%60000) / 1000);

    document.getElementById('d').innerText=(d>=10?d:'0'+d);
    document.getElementById('h').innerText=(h>=10?h:'0'+h);
    document.getElementById('m').innerText=(m>=10?m:'0'+m);
    document.getElementById('s').innerText=(s>=10?s:'0'+s);

    document.getElementById('end').innerText=(d==1?'day':'days');
    document.getElementById('enh').innerText=(h==1?'hour':'hours');
    document.getElementById('enm').innerText=(m==1?'minute':'minutes');
    document.getElementById('ens').innerText=(s==1?'second':'seconds');


    document.getElementById('second').innerHTML = Math.floor(differ/1000);
    if(differ<0){
      document.getElementsByTagName('article')[0].style.display='none';
      // What are you waiting for? Grab your sushi and buy the game
      document.getElementById('sushi').style.display="block";
    }
  },500);
</script>
